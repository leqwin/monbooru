name: Release

# Builds the CPU image for amd64 and arm64 and the CUDA and OpenVINO images
# for amd64, pushes them to GHCR, and creates a GitHub release whose body is
# the latest CHANGELOG.md entry.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: docker/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - variant: cpu
            dockerfile: docker/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: cuda
            dockerfile: docker/Dockerfile.cuda
            arch: amd64
            runner: ubuntu-latest
          - variant: openvino
            dockerfile: docker/Dockerfile.openvino
            arch: amd64
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant }} ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.img.outputs.NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test ${{ matrix.arch }}
        if: matrix.variant == 'cpu' || matrix.variant == 'openvino'
        run: |
          docker run --rm --entrypoint /usr/local/bin/monbooru \
            ghcr.io/${{ steps.img.outputs.NAME }}@${{ steps.build.outputs.digest }} \
            -hash-password smoke-test

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    runs-on: ubuntu-latest
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            suffix: ""
          - variant: cuda
            suffix: "-cuda"
          - variant: openvino
            suffix: "-openvino"
    steps:
      - name: Lowercase image name
        id: img
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag ${{ matrix.variant }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:latest${{ matrix.suffix }} \
            --tag ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }}${{ matrix.suffix }} \
            $(printf 'ghcr.io/${{ steps.img.outputs.NAME }}@sha256:%s ' *)

      - name: Login to GHCR (legacy namespace)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: leqwin
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Push ${{ matrix.variant }} to legacy namespace
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/leqwin/monbooru:latest${{ matrix.suffix }} \
            --tag ghcr.io/leqwin/monbooru:${{ github.ref_name }}${{ matrix.suffix }} \
            ghcr.io/${{ steps.img.outputs.NAME }}:${{ github.ref_name }}${{ matrix.suffix }}

  release:
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog entry
        run: |
          awk '/^## /{if(found){exit} found=1; next} found' CHANGELOG.md > .latest_changelog.md
          if [ ! -s .latest_changelog.md ]; then
            echo "No changelog entry found under a '## ' heading." >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .latest_changelog.md
