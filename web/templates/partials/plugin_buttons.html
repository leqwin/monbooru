{{define "partials/plugin_buttons.html"}}
{{range $g := .Groups}}
<div class="plugin-row">
  <span class="plugin-peer">{{$g.Peer}}:</span>
  {{range $g.Buttons}}
  {{if eq .Mode "open"}}
  <button type="button" class="btn-sm plugin-btn"{{if .Off}} disabled title="{{.Why}}"{{end}}
          data-href="{{.Href}}" data-peer="{{$g.Peer}}"
          onclick="openPluginPage(this)">{{.Label}}</button>
  {{else}}
  <button type="button" class="btn-sm plugin-btn"{{if .Off}} disabled title="{{.Why}}"{{end}}
          data-plugin="{{$g.Peer}}" data-button="{{.Index}}"
          onclick="relayPlugin(this)">{{.Label}}</button>
  {{end}}
  {{end}}
</div>
{{end}}
{{if .AnyOpen}}
<dialog id="plugin-open-dialog">
  <div class="plugin-open-head">
    <span class="plugin-open-title"></span>
    <a class="plugin-open-tab" href="#" target="_blank" rel="noopener">open in a tab ↗</a>
    <button type="button" class="btn-sm" onclick="closePluginPage()">Close</button>
  </div>
  <iframe id="plugin-open-frame" title="plugin page"></iframe>
</dialog>
{{end}}
{{end}}
